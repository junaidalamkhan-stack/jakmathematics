# Content editor configuration (works with Sveltia CMS and Decap CMS).
# 1. Replace OWNER/REPO below with your GitHub username and repository name.
# 2. Open https://<your-site>/admin/ and sign in (see README.md, "Editing without code").
backend:
  name: github
  repo: junaidalamkhan-stack/jakmathematics
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Uploaded PDFs are stored here and linked as materials/uploads/<file>.pdf
media_folder: materials/uploads
public_folder: materials/uploads

site_url: https://junaidalamkhan-stack.github.io/jakmathematics/
display_url: https://junaidalamkhan-stack.github.io/jakmathematics/
locale: en

collections:
  # ------------------------------------------------------------------ COURSES
  - name: courses
    label: Courses & lectures
    description: Add lectures, upload slides and notes, and switch courses on or off.
    files:
      - name: courses
        label: All courses
        file: content/courses.json
        format: json
        fields:
          - name: courses
            label: Courses
            widget: list
            summary: "{{fields.title}} · {{fields.status}}"
            collapsed: true
            fields:
              - { name: id, label: "Web address (short id, e.g. linear-algebra)", widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, digits and hyphens only"] }
              - { name: title, label: Course title, widget: string }
              - { name: level, label: Level, widget: select, options: [Undergraduate, Graduate, Secondary] }
              - { name: status, label: "Status (active = has a course page)", widget: select, options: [active, archived], default: archived }
              - { name: featured, label: Show on homepage, widget: boolean, default: false }
              - { name: order, label: "Order (smaller comes first)", widget: number, value_type: int, default: 50 }
              - { name: icon, label: Icon, widget: select, options: [matrix, graph, integral, group, topology, curve, arrow, school], default: matrix }
              - { name: term, label: "Offering (e.g. Fall 2026)", widget: string, required: false }
              - { name: summary, label: One-line summary (course card), widget: string, required: false }
              - { name: description, label: Course description, widget: text, required: false }
              - { name: prerequisites, label: Prerequisites, widget: string, required: false }
              - { name: textbook, label: Textbook, widget: string, required: false }
              - { name: cvTitle, label: "Name as listed on the CV, if different (optional)", widget: string, required: false }
              - { name: coveredBy, label: "Covered by another course page (id), optional", widget: string, required: false }
              - name: units
                label: "Units (optional: booklet and playlists shown above a unit's lectures)"
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Unit name (must match the lectures' Topic)", widget: string }
                  - { name: summary, label: Short description (unit card), widget: text, required: false }
                  - { name: icon, label: Icon, widget: select, options: [matrix, factor, axes, graph, integral, group, topology, curve, arrow, school], required: false }
                  - { name: booklet, label: "Booklet (PDF upload or Google Drive link)", widget: string, required: false }
                  - name: playlists
                    label: YouTube playlists
                    widget: list
                    required: false
                    fields: [ { name: label, label: "Label (e.g. English)", widget: string, required: false }, { name: url, label: Playlist URL, widget: string } ]
              - name: lectures
                label: Lectures
                widget: list
                required: false
                summary: "{{fields.number}}. {{fields.title}}"
                collapsed: true
                fields:
                  - { name: number, label: Lecture number, widget: number, value_type: int }
                  - { name: title, label: Lecture title, widget: string }
                  - { name: topic, label: "Topic / unit (lectures are grouped by this)", widget: string, required: false }
                  - { name: summary, label: Short summary, widget: text, required: false }
                  - { name: lecture, label: "Lecture (PDF upload or Google Drive link)", widget: string, required: false }
                  - { name: slides, label: Slides (PDF), widget: file, required: false }
                  - { name: notes, label: Notes (PDF), widget: file, required: false }
                  - name: extras
                    label: Other files (problem sets, solutions, handouts)
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: type, label: Type, widget: select, options: [lecture, problems, solutions, notes, slides, other], default: other }
                      - { name: url, label: File, widget: file }
                  - { name: unitNumber, label: "Number shown within its unit (optional)", widget: number, value_type: int, required: false }
                  - { name: video, label: "YouTube video URL (optional)", widget: string, required: false }
                  - name: videos
                    label: "More videos (e.g. English and Urdu/Hindi versions)"
                    widget: list
                    required: false
                    fields: [ { name: label, label: "Label (e.g. Urdu/Hindi)", widget: string, required: false }, { name: url, label: YouTube URL, widget: string } ]
                  - { name: updated, label: "Date posted / updated", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }

  # ------------------------------------------------------------------ PROFILE
  - name: settings
    label: Profile & pages
    files:
      - name: site
        label: Profile, homepage, teaching and CV
        file: content/site.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: title, label: Academic title, widget: string }
          - { name: department, label: Department, widget: string }
          - { name: institution, label: Institution, widget: string }
          - { name: institutionShort, label: Institution (short), widget: string }
          - { name: email, label: Email, widget: string }
          - { name: emailAlt, label: Alternative email, widget: string, required: false }
          - name: links
            label: Profile links (shown on the homepage, Contact and footer)
            widget: object
            fields:
              - { name: github, label: GitHub URL, widget: string, required: false }
              - { name: youtube, label: YouTube channel URL, widget: string, required: false }
              - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
              - { name: iba, label: Official IBA faculty profile URL, widget: string, required: false }
          - { name: cvPdf, label: CV (PDF), widget: file, required: false }
          - { name: photo, label: "Profile photo", widget: image, required: false }
          - { name: heroIntro, label: Homepage introduction, widget: text }
          - { name: aboutMe, label: "About me (homepage, under your name)", widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - { name: coursesHeading, label: "Homepage courses heading", widget: string, required: false }
          - { name: coursesIntro, label: "Homepage courses introduction", widget: text, required: false }
          - name: announcement
            label: Homepage notice
            widget: object
            fields:
              - { name: show, label: Show notice, widget: boolean, default: false }
              - { name: text, label: Text, widget: string, required: false }
              - { name: link, label: "Link (e.g. #courses)", widget: string, required: false }
          - { name: teachingSummary, label: Teaching summary, widget: text }
          - name: teachingApproach
            label: How the courses are taught
            widget: list
            fields: [ { name: title, label: Heading, widget: string }, { name: text, label: Text, widget: text } ]
          - { name: officeHours, label: Office hours, widget: text }
          - { name: office, label: Office, widget: string }
          - { name: studentNote, label: Note to students (Contact page), widget: text }
          - { name: bio, label: About page paragraphs, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - name: education
            label: Education
            widget: list
            summary: "{{fields.degree}}"
            fields:
              - { name: degree, label: Degree, widget: string }
              - { name: institution, label: Institution, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: details, label: Details, widget: list, required: false, field: { name: line, label: Line, widget: string } }
          - name: appointments
            label: Academic appointments
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: institution, label: Institution, widget: string }
              - { name: period, label: Period, widget: string }
          - name: leadership
            label: Administrative experience
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: institution, label: Institution, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: details, label: Details, widget: list, required: false, field: { name: line, label: Line, widget: string } }
          - name: service
            label: Institutional service
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: period, label: Period, widget: string }
          - name: awards
            label: Awards and honours
            widget: list
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { name: title, label: Award, widget: string }
              - { name: body, label: Awarded by, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: teaching, label: Teaching award (highlight), widget: boolean, default: false }
          - name: supervision
            label: Supervision
            widget: object
            fields:
              - name: phd
                label: Ph.D. theses
                widget: list
                summary: "{{fields.year}} · {{fields.student}}"
                fields: &thesis
                  - { name: student, label: Student, widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: year, label: Year, widget: string }
              - { name: masters, label: Master's theses, widget: list, summary: "{{fields.year}} · {{fields.student}}", fields: *thesis }
              - { name: undergraduate, label: Final-year projects, widget: list, summary: "{{fields.year}} · {{fields.student}}", fields: *thesis }
          - name: research
            label: Research (secondary)
            widget: object
            fields:
              - { name: summary, label: Short research summary, widget: text }
              - name: interests
                label: Research interests
                widget: list
                summary: "{{fields.title}}"
                fields: [ { name: title, label: Interest, widget: string }, { name: text, label: Description, widget: text } ]
              - name: software
                label: Software (Developer page)
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "File name (e.g. ncsg.lib)", widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: platform, label: "Platform (SINGULAR or SINGULAR:PLURAL)", widget: string }
                  - { name: authors, label: Developers, widget: string }
                  - { name: text, label: Description, widget: text }
                  - { name: availability, label: "Where it is available (e.g. GitHub, SINGULAR standard library (D.15.17))", widget: string }
                  - { name: url, label: Manual or web page URL, widget: string, required: false }
                  - { name: repo, label: GitHub repository URL, widget: string, required: false }
              - name: publications
                label: Publications
                widget: list
                summary: "{{fields.year}} · {{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: authors, label: Authors, widget: string }
                  - { name: venue, label: Journal, widget: string }
                  - { name: year, label: Year, widget: string }
                  - { name: doi, label: DOI, widget: string, required: false }
                  - { name: url, label: "Article URL (if no DOI)", widget: string, required: false }
          - name: devLinks
            label: Developer page links
            widget: list
            summary: "{{fields.title}}"
            fields: [ { name: title, label: Title, widget: string }, { name: text, label: Description, widget: string }, { name: url, label: URL, widget: string } ]
          - name: technologies
            label: Tools used in teaching
            widget: list
            fields: [ { name: name, label: Name, widget: string }, { name: text, label: Description, widget: text } ]
